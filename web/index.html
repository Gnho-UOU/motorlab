<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motor Lab · Prius 2004 구동모터</title>
</head>
<body>
<canvas id="scene" aria-label="3D 모터 단면"></canvas>
<header class="glass" id="brand"><i></i><b>Motor Lab</b><span>Prius 2004 · IPMSM 8극 48슬롯</span></header>
<div class="glass" id="viewctl">
  <label><input type="checkbox" id="cut" checked> 단면 보기</label>
  <label><input type="checkbox" id="spin"> 회전</label>
  <small id="geo-note"></small>
</div>
<aside class="glass" id="panel">
  <nav id="tabs">
    <button data-tab="eff" class="on">효율맵</button>
    <button data-tab="cyc">전비</button>
    <button data-tab="info">모델·검증</button>
  </nav>
  <section id="tab-eff" class="tab on">
    <div class="ctl"><label>DC 전압 <b id="v-vdc"></b></label><input type="range" id="vdc" min="300" max="650" step="10" value="500"></div>
    <div class="ctl"><label>최대 전류 <b id="v-imax"></b></label><input type="range" id="imax" min="100" max="400" step="10" value="250"></div>
    <div class="ctl"><label>권선 온도 <b id="v-temp"></b></label><input type="range" id="temp" min="20" max="180" step="5" value="100"></div>
    <div class="ctl"><label>손실 모델</label>
      <select id="model"><option value="physical">물리 모델</option><option value="empirical">경험식 포함 (보정)</option></select></div>
    <div class="badge" id="eff-badge"></div>
    <canvas id="effmap" width="640" height="420"></canvas>
    <div class="kv" id="eff-kv"></div>
    <div class="hint" id="eff-hover">효율맵 위에 커서를 올리면 값이 나옵니다.</div>
  </section>
  <section id="tab-cyc" class="tab">
    <div class="ctl"><label>주행 사이클</label><select id="cycle"></select></div>
    <div class="ctl"><label>회생 비율 <b id="v-regen"></b></label><input type="range" id="regen" min="0" max="100" step="5" value="100"></div>
    <div class="ctl"><label>차량 등가 질량 [kg] <small>(비우면 EPA 3250 lb)</small></label><input type="number" id="mass" min="500" max="5000" step="50" placeholder="기본값"></div>
    <button id="run" class="btn">전비 계산</button>
    <div class="badge warn" id="cyc-badge">실험적 · 모터 입력 기준, 순수 전기 구동 환산</div>
    <div class="result" id="cyc-result"></div>
    <canvas id="cycplot" width="640" height="220"></canvas>
    <canvas id="opmap" width="640" height="300"></canvas>
  </section>
  <section id="tab-info" class="tab"><div id="info"></div></section>
</aside>
<div class="glass" id="dock"><span id="dock-label">전비</span><b id="dock-val">—</b><small id="dock-sub"></small></div>
<div id="busy" hidden>계산 중…</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
