<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motor Lab · 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeedea;--ink:#23201d;--mute:#7a736b;--cu:#b86a35;--cu2:#d9915a;--glass:rgba(255,255,255,.74);--line:rgba(35,32,29,.09);--ok:#2f8f5b;--warn:#c98a1a;--bad:#c4413a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 40px rgba(60,40,20,.10),0 1px 0 rgba(255,255,255,.8) inset;border-radius:16px}
#brand{position:fixed;left:22px;top:20px;display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em;font-size:15px;z-index:5}
#brand i{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1b98c,#a85a28);box-shadow:0 0 0 4px rgba(184,106,53,.15)}
#brand span{color:var(--mute);font-weight:400}
#back{position:fixed;left:22px;top:56px;z-index:5;border:0;cursor:pointer;font:500 13px 'IBM Plex Sans KR';padding:8px 14px;color:var(--ink);opacity:0;pointer-events:none;transform:translateY(-4px);transition:.35s}
#back.on{opacity:1;pointer-events:auto;transform:none}
#hero{position:fixed;left:22px;bottom:92px;z-index:4;max-width:340px;transition:opacity .5s,transform .5s}
#hero h1{font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
#hero h1 b{font-weight:600}
#hero p{margin-top:8px;font-size:13px;color:var(--mute);line-height:1.6}
#hero.off{opacity:0;transform:translateY(8px);pointer-events:none}
#chips{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:5px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{border:0;background:transparent;font:500 13px 'IBM Plex Sans KR';color:var(--mute);padding:9px 15px;border-radius:12px;cursor:pointer;white-space:nowrap;transition:.25s}
#chips button:hover{color:var(--ink);background:rgba(184,106,53,.08)}
#chips button.on{background:var(--cu);color:#fff;box-shadow:0 4px 14px rgba(184,106,53,.35)}
#card{position:fixed;right:22px;top:20px;width:min(340px,calc(100vw - 44px));z-index:6;padding:20px 20px 18px;opacity:0;pointer-events:none;transform:translateX(12px);transition:.4s}
#card.on{opacity:1;pointer-events:auto;transform:none}
#card h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
#card .sub{font-size:12px;color:var(--cu);margin-top:2px;font-weight:500}
#card p{font-size:13px;line-height:1.65;color:#4a443e;margin-top:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin-top:14px;font-size:13px}
.kv span{color:var(--mute)}.kv b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;font:500 13px 'IBM Plex Sans KR';padding:10px 16px;border-radius:12px;background:var(--cu);color:#fff;box-shadow:0 4px 14px rgba(184,106,53,.3);transition:.25s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(35,32,29,.06);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:rgba(35,32,29,.1)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.seg{display:flex;background:rgba(35,32,29,.06);border-radius:12px;padding:3px;margin-top:6px}
.seg button{flex:1;border:0;background:transparent;font:500 13px 'IBM Plex Sans KR';padding:8px 6px;border-radius:9px;cursor:pointer;color:var(--mute);transition:.2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.lab{font-size:12px;color:var(--mute);margin-top:14px}
#status{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.55;border:1px solid transparent}
#status.ok{background:rgba(47,143,91,.1);color:#1f6b42;border-color:rgba(47,143,91,.2)}
#status.warn{background:rgba(201,138,26,.12);color:#8a5d0b;border-color:rgba(201,138,26,.25)}
#status.bad{background:rgba(196,65,58,.1);color:#9b2b25;border-color:rgba(196,65,58,.25)}
#status.idle{background:rgba(35,32,29,.05);color:#5a534b}
#run{position:fixed;right:22px;bottom:20px;z-index:5;padding:11px 18px}
#tip{position:fixed;pointer-events:none;z-index:9;padding:6px 10px;border-radius:9px;background:rgba(35,32,29,.88);color:#fff;font-size:12px;opacity:0;transition:opacity .15s;transform:translate(14px,14px);white-space:nowrap}
.pin{position:fixed;left:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;cursor:pointer;transition:opacity .4s;will-change:transform;font-size:12px;font-weight:500;color:var(--ink)}
.pin i{width:12px;height:12px;border-radius:50%;background:var(--cu);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);position:relative;flex:none}
.pin i::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--cu);opacity:.0;animation:pp 2.4s ease-out infinite}
.pin em{font-style:normal;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border:1px solid var(--line);white-space:nowrap}
@keyframes pp{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:13px;color:var(--mute);transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}
@media (max-width:760px){
 #hero{bottom:84px;max-width:70vw}#hero h1{font-size:24px}
 #card{top:auto;bottom:76px;right:12px;left:12px;width:auto;max-height:52vh;overflow:auto;transform:translateY(12px)}
 #run{bottom:auto;top:18px;right:14px;padding:8px 14px}
 #brand{left:16px}#back{left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D 모터 모델"></canvas>
<div id="load">모터를 불러오는 중…</div>
<div id="brand"><i></i>Motor Lab <span>/ 3D 결선 스튜디오</span></div>
<button id="back" class="glass">← 전체 보기</button>
<div id="hero"><h1>6단자 <b>3상 교류전동기</b></h1><p>부품을 눌러 확대하고, 단자박스를 열어 결선을 직접 바꿔 보세요. 드래그로 회전, 휠 또는 핀치로 확대합니다.</p></div>
<div id="card" class="glass"></div>
<div id="tip"></div>
<nav id="chips" class="glass"></nav>
<button id="run" class="btn glass" style="color:var(--ink)">▶ 구동</button>
<div id="pins"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {Reflector} from 'three/addons/objects/Reflector.js';

const $=s=>document.querySelector(s);
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
const DPR=Math.min(devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000,0);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.85;

const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,80);
camera.position.set(6.4,3.6,7.2);
const controls=new OrbitControls(camera,canvas);
controls.target.set(0.1,1.35,0);
controls.enableDamping=true;controls.dampingFactor=0.07;
controls.maxPolarAngle=Math.PI*0.495;
controls.minDistance=1.4;controls.maxDistance=16;
controls.enablePan=false;
controls.update();

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffffff,0xd9d4cc,0.55));
const key=new THREE.DirectionalLight(0xfff6ec,2.1);
key.position.set(4.5,9,5.5);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
const sc=key.shadow.camera;sc.left=-6;sc.right=6;sc.top=6;sc.bottom=-6;sc.near=1;sc.far=26;
key.shadow.radius=6;key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;
scene.add(key);
const rim=new THREE.DirectionalLight(0xffe2c8,0.9);rim.position.set(-6,4,-5);scene.add(rim);
const fill=new THREE.DirectionalLight(0xdfe8ff,0.5);fill.position.set(-5,3,6);scene.add(fill);

// ---------- floor: mirror + fading white veil + shadow ----------
const FLOOR_R=11;
const mirror=new Reflector(new THREE.CircleGeometry(FLOOR_R,64),{
  textureWidth:Math.round(innerWidth*DPR*0.6),textureHeight:Math.round(innerHeight*DPR*0.6),
  color:0xffffff,clipBias:0.003});
mirror.rotation.x=-Math.PI/2;mirror.position.y=0;scene.add(mirror);

function veilTexture(){
  const s=1024,c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(253,253,252,0.80)');
  gr.addColorStop(0.28,'rgba(251,250,249,0.86)');
  gr.addColorStop(0.62,'rgba(244,243,241,0.96)');
  gr.addColorStop(0.86,'rgba(238,237,234,1)');
  gr.addColorStop(1,'rgba(238,237,234,1)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const veil=new THREE.Mesh(new THREE.CircleGeometry(FLOOR_R,64),
  new THREE.MeshBasicMaterial({map:veilTexture(),transparent:true,depthWrite:false,toneMapped:false}));
veil.rotation.x=-Math.PI/2;veil.position.y=0.002;veil.renderOrder=1;scene.add(veil);

// soft contact shadow blob (ambient occlusion feel)
function blobTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  const gr=g.createRadialGradient(256,128,10,256,128,250);
  gr.addColorStop(0,'rgba(20,14,10,0.55)');gr.addColorStop(0.45,'rgba(20,14,10,0.22)');gr.addColorStop(1,'rgba(20,14,10,0)');
  g.save();g.translate(256,128);g.scale(1,0.5);g.translate(-256,-128);g.fillStyle=gr;g.fillRect(0,-128,512,512);g.restore();
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const blob=new THREE.Mesh(new THREE.PlaneGeometry(7.4,4.4),new THREE.MeshBasicMaterial({map:blobTexture(),transparent:true,depthWrite:false,toneMapped:false}));
blob.rotation.x=-Math.PI/2;blob.position.set(0.1,0.004,0);blob.renderOrder=2;scene.add(blob);
const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.ShadowMaterial({opacity:0.22}));
shadowPlane.rotation.x=-Math.PI/2;shadowPlane.position.y=0.006;shadowPlane.receiveShadow=true;shadowPlane.renderOrder=3;scene.add(shadowPlane);

// ---------- material helpers ----------
const M={
  paint:()=>new THREE.MeshPhysicalMaterial({color:0x363a41,roughness:0.42,metalness:0.35,clearcoat:0.55,clearcoatRoughness:0.32}),
  paintLight:()=>new THREE.MeshPhysicalMaterial({color:0x474c54,roughness:0.4,metalness:0.4,clearcoat:0.5,clearcoatRoughness:0.3}),
  steel:()=>new THREE.MeshPhysicalMaterial({color:0xcfd2d6,roughness:0.22,metalness:1}),
  darksteel:()=>new THREE.MeshPhysicalMaterial({color:0x7d8289,roughness:0.38,metalness:1}),
  copper:()=>new THREE.MeshPhysicalMaterial({color:0xc2733a,roughness:0.26,metalness:1,clearcoat:0.3}),
  brass:()=>new THREE.MeshPhysicalMaterial({color:0xcfa25a,roughness:0.28,metalness:1}),
  black:()=>new THREE.MeshStandardMaterial({color:0x17181a,roughness:0.55,metalness:0.2}),
  bakelite:()=>new THREE.MeshStandardMaterial({color:0x2a2018,roughness:0.5,metalness:0.05}),
};
const pickables=[];             // meshes that react to hover/click
const partMeshes={};            // part id -> [mesh]
function reg(mesh,part,{pick=true}={}){
  mesh.userData.part=part;
  mesh.traverse?.(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.userData.part=part;
    if(pick){(partMeshes[part]??=[]).push(o);pickables.push(o);}}});
  return mesh;
}
function mesh(geo,mat,pos=[0,0,0],rot=[0,0,0]){
  const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.rotation.set(...rot);m.castShadow=m.receiveShadow=true;return m;
}
const AX=Math.PI/2; // rotate cylinder (Y axis) to X axis -> rotation.z = AX
const motor=new THREE.Group();scene.add(motor);
const H=1.3;           // axis height
const R=1.0;           // frame radius

// ================= MOTOR BODY (axis = X) =================
const matFrame=M.paint();
// core cylinder
const core=mesh(new THREE.CylinderGeometry(R,R,2.4,96,1),matFrame,[0,H,0],[0,0,AX]);
reg(core,'frame');motor.add(core);
// end flanges
for(const sx of [-1,1]){
  const fl=mesh(new THREE.CylinderGeometry(R+0.06,R+0.06,0.1,96),matFrame,[sx*1.2,H,0],[0,0,AX]);reg(fl,'frame');motor.add(fl);
}
// longitudinal cooling fins (instanced)
{
  const N=72,geo=new THREE.BoxGeometry(2.3,0.17,0.034);
  const inst=new THREE.InstancedMesh(geo,matFrame,N);
  const d=new THREE.Object3D();let k=0;
  for(let i=0;i<N;i++){
    const phi=i/N*Math.PI*2-Math.PI;                       // 0 = top (+y), PI/2 = +z (front)
    const nphi=Math.atan2(Math.sin(phi),Math.cos(phi));
    if(Math.abs(nphi)<0.5) continue;                       // under terminal box
    if(Math.abs(nphi-Math.PI/2)<0.5) continue;             // nameplate band (front)
    if(Math.abs(nphi+Math.PI/2)<0.3) continue;             // cable side (back)
    const rr=R+0.065;
    d.position.set(0,H+rr*Math.cos(phi),rr*Math.sin(phi));
    d.rotation.set(phi,0,0);d.updateMatrix();inst.setMatrixAt(k++,d.matrix);
  }
  inst.count=k;inst.castShadow=inst.receiveShadow=true;reg(inst,'frame');motor.add(inst);
}
// foot blocks + base skid
{
  const skid=mesh(new RoundedBoxGeometry(3.9,0.12,2.5,3,0.03),M.darksteel(),[0,0.06,0]);reg(skid,'frame');motor.add(skid);
  for(const sx of [-0.78,0.78]){
    const b=mesh(new RoundedBoxGeometry(0.62,0.34,2.34,3,0.04),matFrame,[sx,0.29,0]);reg(b,'frame');motor.add(b);
    for(const sz of [-1,1]){
      const bolt=mesh(new THREE.CylinderGeometry(0.075,0.075,0.07,6),M.black(),[sx,0.49,sz*1.04]);reg(bolt,'frame');motor.add(bolt);
    }
  }
  // skid bolts
  for(const sx of [-1.7,1.7])for(const sz of [-1.05,1.05]){
    const bolt=mesh(new THREE.CylinderGeometry(0.07,0.07,0.05,6),M.steel(),[sx,0.145,sz]);reg(bolt,'frame');motor.add(bolt);
  }
  // lifting eye on top-left
  const eye=mesh(new THREE.TorusGeometry(0.1,0.03,12,24),M.steel(),[-0.75,H+R+0.1,0],[0,Math.PI/2,0]);reg(eye,'frame');motor.add(eye);
  const eyeBase=mesh(new THREE.CylinderGeometry(0.1,0.13,0.1,20),matFrame,[-0.75,H+R+0.02,0]);reg(eyeBase,'frame');motor.add(eyeBase);
}

// ---- end shields via lathe ----
function lathe(pts,mat,x,dir){
  const g=new THREE.LatheGeometry(pts.slice().reverse().map(p=>new THREE.Vector2(p[0],p[1])),72);
  const m=mesh(g,mat,[x,H,0],[0,0,dir*AX]);return m;   // dir=-1: +Y→+X ; dir=+1: +Y→-X
}
const matShield=M.paintLight();
const shaftGroup=new THREE.Group();shaftGroup.position.set(0,H,0);motor.add(shaftGroup);
// Drive end shield (+X)
{
  const de=lathe([[0.0,0.32],[0.36,0.32],[0.36,0.22],[0.55,0.17],[0.88,0.07],[1.04,0.05],[1.06,0.0],[1.06,-0.1],[0.0,-0.1]],matShield,1.25,-1);
  reg(de,'shaft');motor.add(de);
  for(let i=0;i<8;i++){ // rim bolts
    const a=i/8*Math.PI*2,r=0.92;
    const b=mesh(new THREE.CylinderGeometry(0.05,0.05,0.04,6),M.steel(),[1.25+0.065,H+Math.cos(a)*r,Math.sin(a)*r],[0,0,AX]);reg(b,'shaft');motor.add(b);
  }
  for(let i=0;i<6;i++){ // bearing cap bolts
    const a=i/6*Math.PI*2+0.3,r=0.27;
    const b=mesh(new THREE.CylinderGeometry(0.03,0.03,0.04,6),M.steel(),[1.25+0.28,H+Math.cos(a)*r,Math.sin(a)*r],[0,0,AX]);reg(b,'shaft');motor.add(b);
  }
}
// Shaft (rotates)
{
  const sh=mesh(new THREE.CylinderGeometry(0.17,0.17,1.0,48),M.steel(),[1.95,0,0],[0,0,AX]);reg(sh,'shaft');shaftGroup.add(sh);
  const step=mesh(new THREE.CylinderGeometry(0.2,0.2,0.1,48),M.steel(),[1.55,0,0],[0,0,AX]);reg(step,'shaft');shaftGroup.add(step);
  const tip=mesh(new THREE.CylinderGeometry(0.14,0.17,0.04,48),M.steel(),[2.47,0,0],[0,0,AX]);reg(tip,'shaft');shaftGroup.add(tip);
  const key=mesh(new RoundedBoxGeometry(0.55,0.05,0.07,2,0.01),M.darksteel(),[2.0,0.175,0]);reg(key,'shaft');shaftGroup.add(key);
  const stripe=mesh(new THREE.BoxGeometry(0.16,0.012,0.09),M.copper(),[2.3,0.172,0]);reg(stripe,'shaft');shaftGroup.add(stripe);
  const stripe2=mesh(new THREE.BoxGeometry(0.16,0.09,0.012),M.copper(),[2.3,0,0.172]);reg(stripe2,'shaft');shaftGroup.add(stripe2);
  const hole=mesh(new THREE.CylinderGeometry(0.04,0.04,0.02,16),M.black(),[2.495,0,0],[0,0,AX]);reg(hole,'shaft');shaftGroup.add(hole);
}
// Non-drive end shield + fan cover (-X)
{
  const nde=lathe([[0.0,0.2],[0.5,0.2],[0.88,0.07],[1.04,0.05],[1.06,0.0],[1.06,-0.1],[0.0,-0.1]],matShield,-1.25,1);
  reg(nde,'fan');motor.add(nde);
  const matCover=M.paint();
  const cover=lathe([[0.0,0.68],[0.55,0.68],[0.86,0.64],[0.97,0.54],[1.0,0.44],[1.0,0.0],[0.9,0.0],[0.9,0.0],[0.0,0.0]],matCover,-1.38,1);
  reg(cover,'fan');motor.add(cover);
  // radial vent slots on the cover end-face
  const slotGeo=new THREE.BoxGeometry(0.03,0.3,0.07),slotMat=M.black();
  const ring=(n,r0,len,rot)=>{
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2+rot;
      const s=mesh(new THREE.BoxGeometry(0.03,len,0.07),slotMat,[-1.38-0.69,H+Math.cos(a)*r0,Math.sin(a)*r0]);
      s.rotation.x=a;s.castShadow=false;reg(s,'fan');motor.add(s);
    }
  };
  ring(32,0.7,0.26,0);ring(22,0.38,0.22,0.1);
  // cover hub with copper cap
  const cap=mesh(new THREE.CylinderGeometry(0.13,0.13,0.05,40),M.copper(),[-1.38-0.7,H,0],[0,0,AX]);reg(cap,'fan');motor.add(cap);
  // cover clamp bolts
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2+Math.PI/4;
    const b=mesh(new THREE.CylinderGeometry(0.045,0.045,0.05,6),M.steel(),[-1.38-0.52,H+Math.cos(a)*0.99,Math.sin(a)*0.99],[0,0,AX]);b.rotation.x=a;reg(b,'fan');motor.add(b);
  }
}
// ---- nameplate ----

function evalWiring(){
  const cAll=links.C0&&links.C1&&links.C2, cAny=links.C0||links.C1||links.C2, cN=+links.C0+ +links.C1+ +links.C2;
  if(!links.Y&&!cAny)return{conn:'none',lvl:'idle',msg:'링크 바가 없습니다. 아래 프리셋을 쓰거나 점선 칸을 눌러 바를 놓으세요.',factor:0};
  if(links.Y&&cAny)return{conn:'bad',lvl:'bad',msg:'Y 바와 Δ 바가 함께 놓여 상간이 단락됩니다. 전원을 넣으면 안 되는 결선입니다.',factor:0};
  if(links.Y)return fin('Y');
  if(cAll)return fin('D');
  return{conn:'part',lvl:'bad',msg:`Δ 바가 ${cN}/3개뿐이라 권선 일부가 열려 있습니다. 3개를 모두 놓아야 Δ가 됩니다.`,factor:0};
}
function fin(c){
  const vph=c==='Y'?supply/Math.sqrt(3):supply, r=vph/400;
  const iph=r*132/Math.sqrt(3), il=c==='Y'?iph:iph*Math.sqrt(3);
  const o={conn:c,vph,r,torque:r*r,il};
  if(Math.abs(r-1)<0.03){o.lvl='ok';o.msg=`정격 결선입니다. 권선에 정격 ${vph.toFixed(0)} V가 걸립니다.`;o.factor=1;}
  else if(r<1){o.lvl='warn';o.msg=`권선 전압이 정격의 ${(r*100).toFixed(0)}%입니다. 기동 시 전류를 줄이는 Y-Δ 기동 상태와 같고 토크는 약 ⅓로 줄어요. 부하를 걸고 오래 두면 과열됩니다.`;o.factor=0.55;}
  else{o.lvl='bad';o.msg=`권선에 정격의 ${(r*100).toFixed(0)}%인 ${vph.toFixed(0)} V가 걸립니다. 절연이 견디지 못해 소손될 수 있으니 Y로 묶어야 합니다.`;o.factor=1.4;}
  return o;
}

    <div class="kv"><span>현재 결선</span><b>${e.conn==='Y'?'Y (스타)':e.conn==='D'?'Δ (델타)':'–'}</b>
    <span>권선 상전압</span><b>${ok?e.vph.toFixed(0)+' V':'–'}</b>
    <span>정격 대비 전압</span><b>${ok?(e.r*100).toFixed(0)+' %':'–'}</b>
    <span>상대 토크 (∝V²)</span><b>${ok?(e.torque*100).toFixed(0)+' %':'–'}</b>
    <span>선전류 (비례 추정)</span><b>${ok?e.il.toFixed(0)+' A':'–'}</b></div>
    <p style="font-size:12px;color:var(--mute)">명판 400 Δ / 690 Y 기준. 전류와 토크는 전압비에 비례·제곱 비례하는 단순 모델이라 실제 부하 특성과는 다릅니다.</p>
    <div class="row"><button class="btn ghost" data-act="close">단자박스 닫기</button></div>`;
  }else{
    const k=mode==='terminal'?'terminal':current, i=INFO[k];
    h=`<h2>${i.t}</h2><div class="sub">${i.s}</div><p>${i.p}</p><div class="kv">${i.kv.map(a=>`<span>${a[0]}</span><b>${a[1]}</b>`).join('')}</div>`;
    if(k==='terminal')h+=`<div class="row"><button class="btn" data-act="open">단자박스 열기</button></div>`;
  }
  cardEl.innerHTML=h;cardEl.classList.add('on');
}
function sync(){
  chipsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===(mode==='open'?'terminal':current)));
  heroEl.classList.toggle('off',mode!=='overview');
  backEl.classList.toggle('on',mode!=='overview');
  pinsEl.style.opacity=mode==='overview'?1:0;pinsEl.style.pointerEvents=mode==='overview'?'auto':'none';
  renderCard();
}
function go(key){
  if(key==='open'){mode='open';current='terminal';lid.target=-1.78;flyTo('open',1.3);}
  else if(key==='overview'){mode='overview';current='overview';lid.target=0;flyTo('overview',1.3);}
  else if(key==='terminal'){mode='terminal';current='terminal';lid.target=0;flyTo('terminal');}
  else{mode='part';current=key;lid.target=0;flyTo(key);}
  sync();
}
function setPreset(p){
  links.Y=p==='Y';links.C0=links.C1=links.C2=p==='D';
  for(const id in SLOTS)SLOTS[id].bar.userData.tt=links[id]?1:0;
}
function toggleSlot(id){links[id]=!links[id];SLOTS[id].bar.userData.tt=links[id]?1:0;renderCard();}

cardEl.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
  if(a==='open')go('open');else if(a==='close')go('terminal');
  else if(a==='pY'){setPreset('Y');renderCard();}else if(a==='pD'){setPreset('D');renderCard();}
  else if(a==='pC'){setPreset('N');renderCard();}
  else if(a==='v400'||a==='v690'){supply=a==='v400'?400:690;renderCard();}
});
chipsEl.addEventListener('click',e=>{const k=e.target.closest('button')?.dataset.k;if(k)go(k==='terminal'&&mode==='open'?'open':k);});
backEl.addEventListener('click',()=>go('overview'));
runEl.addEventListener('click',()=>{running=!running;runEl.textContent=running?'■ 정지':'▶ 구동';});

// pins (hotspots shown in overview)
const pinsEl=$('#pins');
const PINS=[['terminal','단자박스',[CX,3.1,0]],['plate','명판',[0.25,H+0.45,1.1]],['shaft','샤프트',[2.3,H+0.25,0]],['fan','냉각 팬',[-2.1,H+0.55,0.2]],['frame','프레임',[-0.55,H+0.9,0.8]]];
const pinEls=PINS.map(([k,l,p])=>{const d=document.createElement('div');d.className='pin';d.innerHTML=`<i></i><em>${l}</em>`;d.addEventListener('click',()=>go(k));pinsEl.appendChild(d);return {d,p:new THREE.Vector3(...p)};});
const _v=new THREE.Vector3();
function updatePins(){
  if(mode!=='overview')return;
  for(const {d,p} of pinEls){
    _v.copy(p).project(camera);
    const vis=_v.z<1;
    d.style.transform=`translate(${(_v.x*0.5+0.5)*innerWidth-6}px,${(-_v.y*0.5+0.5)*innerHeight-6}px)`;
    d.style.display=vis?'flex':'none';
  }
}

// ================= PICKING =================
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(ev){
  ndc.set(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(mode==='open'){
    const h=ray.intersectObjects(slotMeshes,false)[0];
    if(h)return{slot:h.object.userData.slot};
    const lh=ray.intersectObjects(partMeshes.lid||[],false)[0];
    return lh?{lid:true}:null;
  }
  const h=ray.intersectObjects(pickables,false)[0];
  if(!h)return null;
  let p=h.object.userData.part;if(p==='lid')p='terminal';return{part:p};
}
const glow={};
function setGlowTarget(part){for(const k of ['frame','plate','terminal','shaft','fan'])glow[k]=glow[k]||{v:0,t:0};for(const k in glow)glow[k].t=(k===part)?1:0;}
setGlowTarget(null);
function applyGlow(dt){
  for(const k in glow){
    const g=glow[k];if(Math.abs(g.v-g.t)<0.002)continue;g.v+=(g.t-g.v)*Math.min(1,dt*10);
    const list=[...(partMeshes[k]||[]),...(k==='terminal'?(partMeshes.lid||[]):[])];
    for(const m of list){(Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>{if(mt.emissive){mt.emissive.setRGB(0.38*g.v,0.16*g.v,0.04*g.v);}});}
  }
}
let hoverSlot=null,lastMove=null,moveQueued=false;
function onMove(ev){
  lastMove=ev;if(moveQueued)return;moveQueued=true;
  requestAnimationFrame(()=>{
    moveQueued=false;if(tween||ev.pointerType==='touch')return;
    const h=pick(lastMove);
    hoverSlot=h?.slot||null;
    let label=null;
    if(h?.part&&mode!=='open'){setGlowTarget(h.part);label=PART_NAME[h.part];}
    else if(h?.slot){setGlowTarget(null);label=`링크 바 ${SLOTS[h.slot].label} · 클릭해서 ${links[h.slot]?'빼기':'놓기'}`;}
    else if(h?.lid){label='덮개';setGlowTarget(null);}
    else setGlowTarget(null);
    canvas.style.cursor=h?'pointer':'grab';
    tipEl.textContent=label||'';tipEl.style.opacity=label?1:0;
    tipEl.style.left=lastMove.clientX+'px';tipEl.style.top=lastMove.clientY+'px';
  });
}
let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointermove',onMove);
canvas.addEventListener('pointerleave',()=>{setGlowTarget(null);tipEl.style.opacity=0;});
canvas.addEventListener('pointerup',e=>{
  if(!down||tween)return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
  if(moved>6)return;
  const h=pick(e);if(!h)return;
  if(h.slot){toggleSlot(h.slot);return;}
  if(h.lid){go('terminal');return;}
  if(h.part){
    if(mode==='terminal'&&h.part==='terminal'){go('open');return;}
    go(h.part);
  }
});

// ================= LOOP =================
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<0.8?46:32;camera.updateProjectionMatrix();
  mirror.getRenderTarget().setSize(Math.round(w*DPR*0.6),Math.round(h*DPR*0.6));
}
addEventListener('resize',resize);resize();

setPreset('D');sync();
const clock=new THREE.Clock();let frames=0,pulse=0;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);pulse+=dt;
  if(tween){
    const k=Math.min(1,(performance.now()-tween.t0)/tween.dur),e=ease(k);
    camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);
    if(k>=1){tween=null;controls.enabled=true;}
  }
  controls.update();
  // lid
  lid.angle+=(lid.target-lid.angle)*Math.min(1,dt*5);lidPivot.rotation.x=lid.angle;
  // link bars
  const editing=mode==='open'&&Math.abs(lid.angle-lid.target)<0.12;
  for(const id in SLOTS){
    const s=SLOTS[id],b=s.bar,u=b.userData;
    u.t+=(u.tt-u.t)*Math.min(1,dt*9);
    b.visible=u.t>0.02;b.scale.setScalar(0.4+0.6*u.t);b.scale.y=1;b.position.y=u.baseY+(1-u.t)*0.12;
    const gm=s.ghost.material,em=s.ghost.userData.edge.material;
    const hov=hoverSlot===id;
    const want=editing?(u.tt?0:(hov?0.45:0.14+0.06*Math.sin(pulse*3))):0;
    gm.opacity+=(want-gm.opacity)*Math.min(1,dt*10);
    const ew=editing?(u.tt?(hov?0.9:0):0.75):0;em.opacity+=(ew-em.opacity)*Math.min(1,dt*10);
  }
  // spin
  const e=evalWiring();
  if(running&&e.factor>0)shaftGroup.rotation.x+=dt*3.2*e.factor;
  applyGlow(dt);
  updatePins();
  renderer.render(scene,camera);
  if(++frames===3)$('#load').classList.add('off');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__motor={go,links,setPreset,evalWiring,camera,controls,get mode(){return mode;}};
</script>
</body>
